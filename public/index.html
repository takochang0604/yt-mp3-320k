<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YouTube 影片轉 MP3 320kbps 高音質下載工具">
  <title>YT → MP3 | 高音質下載器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated background -->
  <div class="bg-gradient"></div>
  <div class="bg-particles" id="particles"></div>

  <main class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
            <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <h1>YT → MP3</h1>
          <p class="subtitle">高音質 320kbps 下載器</p>
        </div>
      </div>
      <div class="badge" id="statusBadge">
        <span class="badge-dot"></span>
        <span id="statusText">檢查中...</span>
      </div>
    </header>

    <!-- Setup Card (shown when tools missing) -->
    <div class="card card-setup" id="setupCard" style="display: none;">
      <div class="setup-content">
        <div class="setup-icon">⚙️</div>
        <h2 class="setup-title">需要安裝必要工具</h2>
        <p class="setup-desc">此工具需要 <strong>yt-dlp</strong> 和 <strong>ffmpeg</strong> 才能運作。點擊下方按鈕自動下載安裝。</p>
        <div class="setup-checklist" id="setupChecklist">
          <div class="setup-item" id="setupYtdlp">
            <span class="setup-status">⏳</span>
            <span>yt-dlp</span>
          </div>
          <div class="setup-item" id="setupFfmpeg">
            <span class="setup-status">⏳</span>
            <span>ffmpeg</span>
          </div>
        </div>
        <button id="setupBtn" class="btn-primary">
          <span class="btn-content">🔧 一鍵自動安裝</span>
          <span class="btn-loader" style="display:none;">
            <span class="spinner"></span>
            安裝中...（可能需要幾分鐘）
          </span>
        </button>
      </div>
    </div>

    <!-- Input Card -->
    <div class="card card-input">
      <div class="card-glow"></div>
      <div class="input-section">
        <label for="urlInput" class="input-label">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          貼上 YouTube 網址
        </label>
        <div class="input-wrapper">
          <input
            type="url"
            id="urlInput"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
            spellcheck="false"
          >
          <button id="pasteBtn" class="btn-paste" title="從剪貼簿貼上">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <rect x="8" y="2" width="8" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <button id="convertBtn" class="btn-primary" disabled>
          <span class="btn-content">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            轉換並下載 MP3
          </span>
          <span class="btn-loader" style="display:none;">
            <span class="spinner"></span>
            處理中...
          </span>
        </button>
      </div>
    </div>

    <!-- Video Info Card (hidden by default) -->
    <div class="card card-info" id="infoCard" style="display: none;">
      <div class="info-layout">
        <div class="thumbnail-wrapper">
          <img id="thumbnail" src="" alt="Video Thumbnail" loading="lazy">
          <div class="duration-badge" id="durationBadge"></div>
        </div>
        <div class="info-details">
          <h2 id="videoTitle" class="video-title"></h2>
          <p id="videoUploader" class="video-uploader"></p>
          <div class="info-tags">
            <span class="tag">
              <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
                <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              MP3 320kbps
            </span>
            <span class="tag" id="viewCount">
              <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <span id="viewCountText"></span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress Card (hidden by default) -->
    <div class="card card-progress" id="progressCard" style="display: none;">
      <div class="progress-header">
        <span id="progressStage" class="progress-stage">正在下載...</span>
        <span id="progressPercent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar"></div>
        <div class="progress-bar-glow" id="progressGlow"></div>
      </div>
      <p class="progress-hint" id="progressHint">請耐心等待，轉換中...</p>
    </div>

    <!-- Download Ready Card (hidden by default) -->
    <div class="card card-done" id="doneCard" style="display: none;">
      <div class="done-icon">
        <svg viewBox="0 0 24 24" fill="none" width="48" height="48">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="22,4 12,14.01 9,11.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="done-title">轉換完成！</h2>
      <p class="done-subtitle" id="doneFilename"></p>
      <a id="downloadLink" class="btn-download" href="#" download>
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        下載 MP3 檔案
      </a>
      <button id="resetBtn" class="btn-secondary">轉換其他影片</button>
    </div>

    <!-- Error Card (hidden by default) -->
    <div class="card card-error" id="errorCard" style="display: none;">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" width="48" height="48">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 class="error-title">發生錯誤</h2>
      <p class="error-message" id="errorMessage"></p>
      <button id="retryBtn" class="btn-secondary">重試</button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>僅供個人學習使用 · 請尊重版權</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
